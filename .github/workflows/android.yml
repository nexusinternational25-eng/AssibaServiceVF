name: Application Android

on:
  workflow_dispatch:
  push:
    branches: [ccr-5529c7e0-dmsbd8]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Outils Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Compilation (APK aligné, non signé)
        run: |
          VERSION=$(grep -o 'VERSION = "[^"]*"' android/src/com/assibaservice/app/BuildInfo.java | cut -d'"' -f2)
          CODE=$(cat android/version-code)
          ./android/build.sh "$VERSION" "$CODE"
          mkdir -p android/dist
          rm -f android/dist/*-unsigned.apk
          cp android/build/AssibaService-$VERSION-unsigned.apk android/dist/
      - name: Enregistrement dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/dist
          git commit -m "APK Android non signé (compilation automatique)" || exit 0
          git push
