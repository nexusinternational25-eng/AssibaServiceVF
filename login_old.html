<main>
<h1>Connexion</h1>
  <label>Email/Téléphone <input id="idp"></label><br>
  <label>Mot de passe <input id="pwd" type="password"></label><br>
  <button id="btn">Se connecter</button>
  <script>
    const API=(window.API_BASE||'http://localhost:8080');
    document.getElementById('btn').onclick=function(){
      fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({emailOrPhone:document.getElementById('idp').value,password:document.getElementById('pwd').value})})
      .then(r=>r.json()).then(d=>{
        if(!d.ok){ alert(d.error||'Erreur'); return; }
        localStorage.setItem('TOKEN', d.token);
        localStorage.setItem('ME', JSON.stringify(d.user));
        if(d.user.role==='client') location.href='/apps/web/public/client_dashboard.html';
        else if(d.user.role==='prestataire') location.href='/apps/web/public/prestataire_dashboard.html';
        else location.href='/apps/admin/ui/dashboard.html';
      });
    };
  </script>
</main>
