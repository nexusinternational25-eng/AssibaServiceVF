<header class='header' role='banner'>

    <div class='brand' aria-label='AssibaService'>
      <img src='/apps/web/public/assets/logo/logo_officiel.jpeg' alt='Logo AssibaService'>

    <nav aria-label='Navigation principale'>

<main>
<h1>Mon espace client</h1>
  <div id="me"></div>
  <div style="margin:.5rem 0;">
    <a href="/apps/web/public/form_client.html">Demander un service</a>
  </div>
  <div id="wallet">Solde: —</div>
  <button id="logout">Se déconnecter</button>
  <script>
    const API=(window.API_BASE||'http://localhost:8080');
    const token=localStorage.getItem('TOKEN');
    if(!token){ location.href='/apps/web/public/login.html'; }
    fetch(API+'/me',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(d=>{
      if(d.user){
        document.getElementById('me').textContent = d.user.name + ' ('+d.user.email+')';
        fetch(API+'/wallet/'+d.user.id).then(r=>r.json()).then(w=>{
          document.getElementById('wallet').textContent = 'Solde: ' + (w.user.wallet_balance||0).toFixed(2) + ' FCFA';
        });
      }
    });
    document.getElementById('logout').onclick=function(){ localStorage.removeItem('TOKEN'); localStorage.removeItem('ME'); location.href='/apps/web/public/login.html'; };
  </script>
</main>
